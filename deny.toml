[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDDL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    # Moonlink permission.
    "LicenseRef-BSL-1.1",
    "MIT",
    "Unicode-3.0",
]

[sources]
unknown-git = "deny"
allow-git = [
    "https://github.com/apache/iceberg-rust.git",
    "https://github.com/Mooncake-Labs/rust-postgres.git?rev=14c8e599f5551a8caa96ff5023685a6f537a1455",
]

# Advisories without a fix moonlink can take. Each entry says why it is acceptable; remove it once a fix is reachable.
[advisories]
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained, with no known vulnerability; it only expands macros at compile time" },
    { id = "RUSTSEC-2025-0141", reason = "bincode is unmaintained, with no known vulnerability; moonlink encodes its own RPC and metadata messages with it" },
    { id = "RUSTSEC-2026-0459", reason = "the bundled SQLite bug needs a crafted database and -wal file pair; moonlink only opens its own metadata store in its private data directory, and sqlx 0.8 pins libsqlite3-sys 0.30 (sqlx 0.9 needs Rust 1.94 and still caps it below the fix)" },
    { id = "RUSTSEC-2026-0435", reason = "denial of service on hostile thrift input; parquet uses it for file footers, and moonlink only reads parquet files it wrote itself (load_files is rejected). The fix needs parquet 58.4, an arrow/parquet major bump tied to the iceberg pin" },
    { id = "RUSTSEC-2026-0194", reason = "CPU denial of service on hostile XML; quick-xml parses responses of the configured object store (opendal and reqsign, pinned by iceberg) and, with the profile-test feature only, pprof's flamegraphs. The fix needs quick-xml 0.41, which none of them accept" },
    { id = "RUSTSEC-2026-0195", reason = "memory denial of service on hostile XML; same quick-xml users and constraint as RUSTSEC-2026-0194" },
]

# TODO(hjiang): Resolve all duplicate dependencies.
[bans]
skip = [
    { name = "bitflags" },
    { name = "darling" },
    { name = "darling_core" },
    { name = "darling_macro" },
    { name = "foldhash" },
    { name = "getrandom" },
    { name = "hashbrown" },
    { name = "itertools" },
    { name = "nix" },
    { name = "ordered-float" },
    { name = "quick-xml" },
    { name = "rand" },
    { name = "rand_chacha" },
    { name = "rand_core" },
    { name = "spin" },
    { name = "socket2" },
    { name = "typed-builder" },
    { name = "typed-builder-macro" },
    { name = "windows-link" },
    { name = "windows-sys" },
    { name = "windows-result" },
    { name = "windows-strings" },
]
