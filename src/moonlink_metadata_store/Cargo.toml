[package]
name = "moonlink_metadata_store"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[features]
default = ["storage-fs", "metadata-sqlite"]
storage-all = ["storage-fs", "metadata-sqlite"]

storage-s3 = ["moonlink/storage-s3"]
storage-fs = ["moonlink/storage-fs"]

metadata-sqlite = ["sqlx"]

test-utils = ["moonlink/test-utils"]

[dependencies]
async-trait = { workspace = true }
moonlink = { workspace = true }
moonlink_error = { workspace = true }
more-asserts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { version = "0.8", features = [
  "sqlite",
  "runtime-tokio",
], optional = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
