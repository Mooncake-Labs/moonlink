          path: /tmp/chaos_test_*
          retention-days: 3
          if-no-files-found: warn

  # ───────────── 16 · PostgreSQL Integration Tests ─────────────
  postgres_tests:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --name postgres
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        id: toolchain

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: ${{ steps.toolchain.outputs.cachekey }}

      - uses: rui314/setup-mold@v1
        with:
          mold-version: 2.40.3
          make-default: true

      - name: Wait for PostgreSQL
        timeout-minutes: 2
        run: |
          set -euo pipefail
          for i in {1..10}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "PostgreSQL is ready!"
              exit 0
            fi
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "ERROR: PostgreSQL failed to start."
          exit 1

      - name: Configure PostgreSQL for logical replication
        timeout-minutes: 2
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d postgres -c "ALTER SYSTEM SET wal_level = 'logical';"
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d postgres -c "SELECT pg_reload_conf();"

      - name: Restart PostgreSQL to apply wal_level
        timeout-minutes: 2
        run: |
          set -euo pipefail
          docker restart postgres
          for i in {1..10}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "PostgreSQL restarted and ready!"
              exit 0
            fi
            echo "Waiting for PostgreSQL after restart..."
            sleep 2
          done
          echo "ERROR: PostgreSQL failed to restart."
          exit 1

      - name: Run PostgreSQL integration tests
        timeout-minutes: 10
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          RUST_BACKTRACE=1 cargo test --package moonlink_connectors --lib --features connector-pg
          RUST_BACKTRACE=1 cargo test --package moonlink_metadata_store --tests --features "metadata-all test-utils storage-s3"
          RUST_BACKTRACE=1 cargo test --package moonlink_service --lib --features postgres-integration -- --nocapture

      - name: Build Backend integration tests
        timeout-minutes: 30
        run: |
          cargo test --package moonlink_backend --test '*' --features test-utils --no-run

      - name: Run Backend integration tests
        timeout-minutes: 30
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          MOONLINK_TEST_PG_CTL: ${{ github.workspace }}/.github/scripts/pg_control.sh
        run: |
          RUST_BACKTRACE=1 cargo test --package moonlink_backend --test '*' --features test-utils --no-fail-fast

      - name: Make sure PostgreSQL is running after the backend tests
        if: always()
        timeout-minutes: 2
        run: |
          .github/scripts/pg_control.sh start

      - name: Run postgres bulk ingestion integration test
        # TODO(hjiang): Update after we figure out the regression change.
        # Each iteration re-reads every row inserted so far; run time grows quadratically (~150 of 200 iterations in 10 min on hosted runners).
        timeout-minutes: 25
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          RUST_BACKTRACE=1 cargo test test_bulk_insert_multiple_iterations --features=bulk-ingestion-test -p moonlink_backend -- --nocapture
