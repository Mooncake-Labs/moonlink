          if-no-files-found: warn

  # ───────────── 10 · Chaos test with chaos injection ─────────────
  chaos_test_with_chaos_injection:
    name: Chaos test with chaos injection
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

