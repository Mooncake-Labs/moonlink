name: CI

on:
  push:
    branches: [main, v0.3-dev]
  pull_request:
    branches: [main, v0.3-dev, 'slim/**']

# Cancel superseded runs for the same branch / PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

defaults:
  run:
    shell: bash

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------
jobs:
  # ────────────────────────────── 1 · FORMAT + CLIPPY ─────────────────────────
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
        with:
          components: rustfmt,clippy

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-sort

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: ${{ steps.toolchain.outputs.cachekey }}

      - name: rustfmt check
        run: cargo fmt --check

      - name: clippy lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo deny check
        run: cargo deny check

      - name: cargo dependency format and check
        run: cargo sort --workspace --check

  # ──────────────────────── 3 · S3 test (feature, chaos) ───────────────────
  s3_test:
    name: S3 tests (feature, chaos)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        type: [feature, chaos]
        include:
          - type: feature
            name: S3 feature test
            timeout-minutes: 10
            cmd: |
              RUST_BACKTRACE=1 cargo test --lib --features=storage-s3
          - type: chaos
            name: S3 chaos test
            timeout-minutes: 20
            cmd: |
              RUST_BACKTRACE=1 cargo test test_s3_chaos --features=chaos-test,storage-s3 -p moonlink -- --nocapture
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        id: toolchain

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: ${{ steps.toolchain.outputs.cachekey }}

      - uses: rui314/setup-mold@v1
        with:
          mold-version: 2.40.3
          make-default: true

      # ─────────────────────── Start Fake S3 Server ──────────────────────────
      # Filesystem accessor chaos does not need S3; it runs before, and regardless of, the emulator.
      - name: Run filesystem accessor chaos test
        if: matrix.type == 'chaos'
        timeout-minutes: 20
        run: |
          RUST_BACKTRACE=1 cargo test storage::filesystem::accessor -p moonlink --features=chaos-test

      - name: Start Fake S3 Server
        id: fake_s3
        timeout-minutes: 5
        run: |
          # minio/minio (Docker Hub) and quay.io/minio/minio are no longer publicly pullable. Until a
          # maintained S3 emulator image is pinned here (then remove this skip), skip the tests that need
          # S3 when the image is gone, but fail on any other pull error (rate limit, network).
          image=minio/minio:latest
          for attempt in 1 2 3; do
            if err=$(docker pull "$image" 2>&1); then
              break
            fi
            if grep -qiE 'pull access denied|repository does not exist|manifest unknown|manifest for .* not found' <<<"$err"; then
              msg="$image is not available ($(tail -n 1 <<<"$err")); skipping the steps that need an S3 emulator."
              echo "::warning title=S3 emulator unavailable::$msg"
              echo "**${{ matrix.name }} skipped** (${{ github.job }}, needs the S3 emulator): $msg" >> "$GITHUB_STEP_SUMMARY"
              echo "available=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "docker pull failed (attempt $attempt/3): $err"
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 15
          done
          docker run -d \
            --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            "$image" server /data
          echo "available=true" >> "$GITHUB_OUTPUT"

      # ─────────────── Add hostnames to /etc/hosts ──────────────────────────
      - name: Add s3.local to /etc/hosts
        if: steps.fake_s3.outputs.available == 'true'
        run: |
          echo "127.0.0.1 s3.local" | sudo tee -a /etc/hosts

      # ───────────────────── Wait for Fake S3 to be ready ───────────────────
      - name: Wait for Fake S3
        if: steps.fake_s3.outputs.available == 'true'
        timeout-minutes: 2
        run: |
          set -euo pipefail
          for i in {1..10}; do
            if curl -sf http://s3.local:9000/minio/health/ready; then
              echo "Fake S3 is ready!"
              exit 0
            fi
            echo "Waiting for Fake S3..."
            sleep 2
          done
          echo "ERROR: Fake S3 failed to start."
          exit 1

      # ────────────────────── Toolchain + Test Tools ─────────────────────────
      - name: Run ${{ matrix.name }}
        if: steps.fake_s3.outputs.available == 'true'
        timeout-minutes: ${{ matrix.timeout-minutes }}
        run: |
          ${{ matrix.cmd }}

      #  ────────────────────── Upload chaos dump ────────────────────────────
      - name: Upload chaos dumps
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: chaos-dumps-${{ github.run_id }}-${{ github.job }}-${{ matrix.target || 'no-matrix' }}
          path: /tmp/chaos_test_*
          retention-days: 3
          if-no-files-found: warn

  # ───────────────────────── 7 · TEST & COVERAGE ────────────────────────────
  coverage:
    name: Unit Tests + Coverage (llvm-cov + nextest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # ────────────────────── Toolchain + Test Tools ─────────────────────────
      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
        with:
          components: llvm-tools-preview

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: ${{ steps.toolchain.outputs.cachekey }}

      - uses: rui314/setup-mold@v1
        with:
          mold-version: 2.40.3
          make-default: true

      - uses: taiki-e/install-action@v2
        with: { tool: cargo-llvm-cov }
      - uses: taiki-e/install-action@v2
        with: { tool: nextest }

      - name: Run tests via llvm-cov/nextest
        timeout-minutes: 10
        run: |
          cargo llvm-cov \
            --locked \
            --lib \
            --workspace \
            --lcov --output-path lcov.info \
            nextest \
              --profile ci \
              --no-fail-fast

      # ---------- Upload JUnit test results to Codecov ----------
      - name: Upload test results (JUnit)
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: target/nextest/ci/junit.xml
          # Codecov availability must not decide whether tests pass.
          fail_ci_if_error: false

      # ---------- Upload coverage report to Codecov ----------
      - name: Upload coverage (lcov)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: lcov.info
          # Codecov availability must not decide whether tests pass.
          fail_ci_if_error: false

  # ───────────── Wire format goldens (duckdb_mooncake compatibility) ─────────────
  # Integration tests under tests/ are not covered by the `--lib` unit job.
  wire_format:
    name: Wire format golden tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        id: toolchain

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: ${{ steps.toolchain.outputs.cachekey }}

      - name: Run wire format golden tests
        timeout-minutes: 15
        run: |
          RUST_BACKTRACE=1 cargo test --locked -p moonlink_rpc -p moonlink_table_metadata --tests
          RUST_BACKTRACE=1 cargo test --locked -p moonlink --test scan_payload_order

  # ────────────────────────8 · Chaos test ────────────────────────────
  chaos_test:
    name: Chaos test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        id: toolchain

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: ${{ steps.toolchain.outputs.cachekey }}

      - uses: rui314/setup-mold@v1
        with:
          mold-version: 2.40.3
          make-default: true

      - name: Start chaos test
        timeout-minutes: 20
        run: |
          RUST_BACKTRACE=1 cargo test table_handler::chaos_test::test_chaos_on_local_fs --features=chaos-test -p moonlink -- --nocapture

      #  ────────────────────── Upload chaos dump ────────────────────────────
      - name: Upload chaos dumps
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: chaos-dumps-${{ github.run_id }}-${{ github.job }}-${{ matrix.target || 'no-matrix' }}
          path: /tmp/chaos_test_*
          retention-days: 3
          if-no-files-found: warn

  # ───────────── 9 · Chaos test with local fs optimization ─────────────
  chaos_test_with_local_fs_optimization:
    name: Chaos test with local filesystem optimization
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        id: toolchain

      - uses: swatinem/rust-cache@v2
