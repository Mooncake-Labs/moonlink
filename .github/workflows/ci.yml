      - name: Start regression test
        timeout-minutes: 20
        run: |
          RUST_BACKTRACE=1 cargo test table_handler::regression --features=chaos-test -p moonlink -- --nocapture
  
  # ───────────── 15 · Replay chaos test  ─────────────
  replay_chaos_test:
